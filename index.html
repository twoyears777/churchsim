<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Churchsim – Raum-Editor</title>
<link rel="stylesheet" href="stil.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="symbol-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Churchsim">
<meta name="theme-color" content="#2b2a27">
</head>
<body class="modus-spiel">
<div class="spielflaeche">
  <aside class="seitenleiste hud" aria-label="Management">
    <details open>
      <summary><span data-text="seite.mitarbeiter"></span></summary>
      <div class="gruppe">
        <div class="kopf"><span class="punkt hauptamt"></span><span data-text="seite.hauptamtliche"></span> <b id="anzHauptamt">0/0</b> <span data-text="seite.verfuegbar"></span></div>
        <ul id="listeHauptamt" class="personen"></ul>
      </div>
      <div class="gruppe">
        <div class="kopf"><span class="punkt ehrenamt"></span><span data-text="seite.ehrenamtliche"></span> <b id="anzEhrenamt">0/0</b> <span data-text="seite.verfuegbar"></span></div>
        <div class="unter" id="anzEaFrei"></div>
        <ul id="listeEhrenamt" class="personen"></ul>
      </div>
    </details>
    <details open>
      <summary><span data-text="seite.finanzen"></span> <span class="zugeklappt" id="kontoKurz">0 €</span></summary>
      <table class="finanzen anklickbar" id="finanzenAuf" role="button" tabindex="0">
        <tr class="konto"><td data-text="kontostand"></td><td class="zahl" id="kontostand">0 €</td></tr>
        <tr><td data-text="seite.einnahmenVoraus"></td><td class="zahl" id="progEinnahmen">0 €</td></tr>
        <tr><td data-text="seite.ausgabenVoraus"></td><td class="zahl" id="progAusgaben">0 €</td></tr>
      </table>
    </details>
    <details open>
      <summary><span data-text="seite.besucher"></span> <span class="zugeklappt" id="besucherKurz">0</span></summary>
      <table class="finanzen">
        <tr><td id="textLetzter"></td><td class="zahl" id="besucherLetzter">–</td></tr>
        <tr><td id="textHeim"></td><td class="zahl" id="besucherHeim">–</td></tr>
        <tr><td id="textStamm"></td><td class="zahl" id="besucherStamm">–</td></tr>
      </table>
    </details>
  </aside>

  <main id="flaeche" class="flaeche">
    <canvas id="karte"></canvas>

    <div class="oben hud">
      <span class="wert"><small id="textKonto"></small><b id="kontoOben">0 €</b></span>
      <button id="bekanntheitAuf" class="wert wert-knopf"><small id="textBekanntheit"></small><b id="bekanntheit">0</b></button>
      <span id="heiligkeitWert" class="wert"><small id="textHeiligkeit"></small><b id="heiligkeit">0</b></span>
      <span class="tempo" role="group" aria-label="Zeit">
        <button data-tempo="0"></button><button data-tempo="1"></button><button data-tempo="2"></button><button data-tempo="5"></button><button data-tempo="10"></button><button data-tempo="25"></button>
      </span>
      <button id="menschenAuf" class="menschen-knopf"></button>
      <button id="forschungAuf" class="menschen-knopf"></button>
      <button id="kalenderAuf" class="menschen-knopf"></button>
    </div>
    <div class="datum hud" id="kirchenjahrAuf" role="button" tabindex="0">
      <div class="datumText"><b id="uhr"></b><small id="countdown"></small><small id="naechstesEvent"></small><small id="sonntag"></small></div>
      <svg id="rad" viewBox="-50 -50 100 100" width="64" height="64" role="img" aria-label="Kirchenjahr"></svg>
    </div>
    <div class="unten-links hud"><button id="hilfeAuf" class="klein-knopf version-knopf"></button><button id="hauptmenueAuf" class="klein-knopf version-knopf"></button><button id="versionAuf" class="klein-knopf version-knopf"></button></div>
    <div class="unten-mitte hud"><button id="editorAuf" data-text="seite.bauen"></button></div>
    <div class="unten-rechts hud">
      <p id="meldung" class="spielHinweis meldung"></p>
      <p id="spielHinweis" class="spielHinweis"></p>
      <span class="testgeld"><input id="testGeldBetrag" type="number" min="1" step="100" value="1000"><button id="testGeld" class="klein-knopf"></button></span>
    </div>

    <aside id="raumSpicker" class="raum-spicker editor"></aside>

    <div id="maske" class="maske" hidden><div class="inhalt"></div></div>
  </main>
</div>
<footer class="bauleiste editor" aria-label="Bauen">
  <div class="hinweis-zeile"><p id="hinweis" class="hinweis"></p><button id="drehen" class="klein-knopf" hidden></button></div>
  <div class="bau-zeile">
    <div class="reiter" role="tablist" id="bauReiter"></div>
    <div class="bau-karten" id="bauKarten" role="toolbar" aria-label="Werkzeuge"></div>
    <div class="bau-rechts">
      <button data-werkzeug="abriss" class="abriss-knopf" aria-pressed="false"><canvas class="symbol" data-symbol="abriss" width="56" height="56"></canvas><span id="textAbriss"></span></button>
      <span class="kontoEditor"><span data-text="kontostand"></span> <b id="kontoEditor">0 €</b></span>
      <button id="hilfeEditor"></button>
      <button id="zurueck" data-text="seite.rueckgaengig"></button>
      <button id="neu"></button>
      <button id="editorZu" class="haupt" data-text="seite.fertig"></button>
    </div>
  </div>
</footer>
<div id="intro" class="intro"><p id="introText" class="intro-text"></p></div>
<div id="hauptmenue" class="hauptmenue" hidden>
  <div class="menue-schild" role="dialog" aria-modal="true" aria-labelledby="menueTitel">
    <h1 id="menueTitel" class="menue-titel"></h1>
    <div id="menueKnoepfe" class="menue-knoepfe">
      <button id="menueWeiter" class="menue-knopf"></button>
      <button id="menueNeu" class="menue-knopf"></button>
      <button id="menueBeenden" class="menue-knopf" hidden></button>
    </div>
    <div id="menueRueckfrage" class="menue-knoepfe" hidden>
      <p id="menueFrage" class="menue-frage"></p>
      <button id="menueJa" class="menue-knopf"></button>
      <button id="menueAbbrechen" class="menue-knopf"></button>
    </div>
  </div>
</div>
<script type="module" src="src/oberflaeche/start.js"></script>
</body>
</html>
