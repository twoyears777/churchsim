<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Churchsim – Raum-Editor</title>
<link rel="stylesheet" href="stil.css">
</head>
<body class="modus-spiel">
<header class="leiste hud">
  <div class="anzeigen">
    <div class="anzeige"><span class="punkt hauptamt"></span>Hauptamtliche <b id="anzHauptamt">0/0</b> verfügbar</div>
    <div class="anzeige"><span class="punkt ehrenamt"></span>Ehrenamtliche <b id="anzEhrenamt">0/0</b> verfügbar</div>
  </div>
  <div class="werkzeuge"><button id="editorAuf">Bauen</button></div>
</header>
<header class="leiste editor">
  <div class="werkzeuge" role="toolbar" aria-label="Werkzeuge">
    <button data-werkzeug="wand" aria-pressed="true">Wand</button>
    <button data-werkzeug="tuer" aria-pressed="false">Tür</button>
    <button data-werkzeug="abriss" aria-pressed="false">Abriss</button>
    <button data-werkzeug="raum" aria-pressed="false">Raum festlegen</button>
  </div>
  <div class="werkzeuge">
    <button id="zurueck">Rückgängig</button>
    <button id="neu">Neu</button>
    <button id="editorZu" class="haupt">Fertig</button>
  </div>
</header>
<p id="hinweis" class="hinweis editor"></p>
<main id="flaeche" class="flaeche">
  <canvas id="karte"></canvas>
  <div id="maske" class="maske" hidden><div class="inhalt"></div></div>
</main>
<script type="module" src="src/oberflaeche/editor.js"></script>
</body>
</html>
