<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Churchsim – Raum-Editor</title>
<link rel="stylesheet" href="stil.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="symbol-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Churchsim">
<meta name="theme-color" content="#2b2a27">
</head>
<body class="modus-spiel">
<header class="leiste editor">
  <div class="werkzeuge" role="toolbar" aria-label="Werkzeuge">
    <button data-werkzeug="wand" aria-pressed="true">Wand</button>
    <button data-werkzeug="tuer" aria-pressed="false">Tür</button>
    <button data-werkzeug="stuhl" aria-pressed="false">Stuhl</button>
    <button data-werkzeug="abriss" aria-pressed="false">Abriss</button>
    <button data-werkzeug="raum" aria-pressed="false">Raum festlegen</button>
  </div>
  <div class="werkzeuge">
    <span class="kontoEditor">Kontostand <b id="kontoEditor">0 €</b></span>
    <button id="zurueck">Rückgängig</button>
    <button id="neu">Neu</button>
    <button id="editorZu" class="haupt">Fertig</button>
  </div>
</header>
<p id="hinweis" class="hinweis editor"></p>

<div class="spielflaeche">
  <aside class="seitenleiste hud" aria-label="Management">
    <details open>
      <summary>Mitarbeiter</summary>
      <div class="gruppe">
        <div class="kopf"><span class="punkt hauptamt"></span>Hauptamtliche <b id="anzHauptamt">0/0</b> verfügbar</div>
        <ul id="listeHauptamt" class="personen"></ul>
      </div>
      <div class="gruppe">
        <div class="kopf"><span class="punkt ehrenamt"></span>Ehrenamtliche <b id="anzEhrenamt">0/0</b> verfügbar</div>
        <ul id="listeEhrenamt" class="personen"></ul>
      </div>
    </details>
    <details open>
      <summary>Finanzen</summary>
      <table class="finanzen">
        <tr class="konto"><td>Kontostand</td><td class="zahl" id="kontostand">0 €</td></tr>
        <tr><td>Voraussichtliche Einnahmen</td><td class="zahl" id="progEinnahmen">0 €</td></tr>
        <tr><td>Voraussichtliche Ausgaben</td><td class="zahl" id="progAusgaben">0 €</td></tr>
      </table>
    </details>
  </aside>

  <main id="flaeche" class="flaeche">
    <canvas id="karte"></canvas>

    <div class="datum hud">
      <div class="datumText"><b id="sonntag"></b><small id="zeit"></small></div>
      <svg id="rad" viewBox="-50 -50 100 100" width="64" height="64" role="img" aria-label="Kirchenjahr"></svg>
    </div>
    <div class="unten-mitte hud"><button id="editorAuf">Bauen</button></div>
    <div class="unten-rechts hud">
      <p id="spielHinweis" class="spielHinweis"></p>
      <button id="wocheBeenden" class="haupt">Woche beenden</button>
    </div>

    <div id="maske" class="maske" hidden><div class="inhalt"></div></div>
    <div id="rueckblick" class="rueckblick" hidden><div class="inhalt"></div></div>
  </main>
</div>
<script type="module" src="src/oberflaeche/editor.js"></script>
</body>
</html>
